<!doctype html>
<meta charset="utf-8" />
<!--
  The app icon: the overlay's orb on a dark macOS icon body, with the ripple it
  shows while listening. Rendered to build/icon.png by render.cjs.
  Geometry follows Apple's 1024 px icon grid: an 824 px body, 100 px margin.
-->
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .body {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
    border-radius: 186px;
    background:
      radial-gradient(circle at 50% 38%, rgba(52, 211, 153, 0.16), transparent 58%),
      linear-gradient(165deg, #23232c 0%, #121217 55%, #0b0b0f 100%);
    box-shadow:
      0 18px 36px rgba(0, 0, 0, 0.32),
      inset 0 2px 0 rgba(255, 255, 255, 0.09),
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  .ring {
    position: absolute; left: 50%; top: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 9px solid rgba(52, 211, 153, 0.30);
  }
  .r1 { width: 560px; height: 560px; border-color: rgba(52, 211, 153, 0.30); }
  .r2 { width: 700px; height: 700px; border-color: rgba(34, 211, 238, 0.14); border-width: 7px; }
  .orb {
    position: absolute; left: 50%; top: 50%;
    width: 400px; height: 400px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.62), transparent 40%),
      conic-gradient(from 210deg at 62% 66%, #34d399, #22d3ee, #818cf8, #34d399);
    box-shadow:
      0 0 90px -6px rgba(52, 211, 153, 0.65),
      inset 0 -18px 40px rgba(11, 11, 15, 0.28);
  }
</style>
<div class="body">
  <div class="ring r2"></div>
  <div class="ring r1"></div>
  <div class="orb"></div>
</div>
